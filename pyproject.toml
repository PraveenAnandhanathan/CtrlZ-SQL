[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlz-sql"
version = "0.1.0"
description = "Undo for SQL: capture row images as changes happen, then reverse them with conflict detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sql", "undo", "postgres", "sqlite", "database", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "sqlglot>=25",
    "PyYAML>=6",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
pg-parser = ["pglast>=6"]
dev = ["psycopg2-binary>=2.9", "pglast>=6", "pytest>=7"]

[project.scripts]
ctrlz = "ctrlz.cli:main"

[tool.setuptools.packages.find]
include = ["ctrlz*"]

[tool.setuptools.package-data]
ctrlz = ["policy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
