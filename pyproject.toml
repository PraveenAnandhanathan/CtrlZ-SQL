[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctrlz-sql"
version = "0.1.0"
description = "Undo for SQL: capture row images as changes happen, then reverse them with conflict detection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Praveen Anandhanathan", email = "prave.anand124@gmail.com" }]
keywords = ["sql", "undo", "postgres", "sqlite", "database", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=25",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/PraveenAnandhanathan/CtrlZ-SQL"
Repository = "https://github.com/PraveenAnandhanathan/CtrlZ-SQL"
Issues = "https://github.com/PraveenAnandhanathan/CtrlZ-SQL/issues"

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
pg-parser = ["pglast>=6"]
mysql = ["PyMySQL>=1.1"]
dev = [
    "psycopg2-binary>=2.9",
    "psycopg[binary]>=3.1",
    "pglast>=6",
    "PyMySQL>=1.1",
    "sqlalchemy>=2",
    "pytest>=7",
]

[project.scripts]
ctrlz = "ctrlz.cli:main"

[tool.setuptools.packages.find]
include = ["ctrlz*"]

[tool.setuptools.package-data]
ctrlz = ["policy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
