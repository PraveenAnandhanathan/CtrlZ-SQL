name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctrlz
          POSTGRES_PASSWORD: ctrlz
          POSTGRES_DB: ctrlz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ctrlz
          MYSQL_DATABASE: ctrlz_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pctrlz"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the PostgreSQL client
        # The gateway tests drive a real psql, because a wire proxy that has
        # only been tested against a mock has not been tested.
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install
        run: pip install -e ".[dev]"

      - name: Allow MySQL triggers for a non-SUPER user
        run: >-
          mysql -h 127.0.0.1 -uroot -pctrlz
          -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run the suite against all three engines
        env:
          CTRLZ_TEST_PG_DSN: postgresql://ctrlz:ctrlz@127.0.0.1:5432/ctrlz_test
          CTRLZ_TEST_MYSQL_DSN: mysql://root:ctrlz@127.0.0.1:3306/ctrlz_test
          # Turn "no database, so skip" into a failure. Without this the suite
          # exits 0 having tested only SQLite if a service container never came
          # up, and the badge would say nothing about the other two engines.
          CTRLZ_REQUIRE_ENGINES: postgres,mysql
        run: pytest -q

      - name: Publish the benchmark numbers
        # Spec §10.6: benchmarks must run in CI *and publish numbers*. Asserting
        # a budget only says nothing collapsed; the numbers say what it costs
        # and which way that is moving. They land in the job summary.
        if: matrix.python == '3.12'
        run: pytest tests/test_benchmark.py -q -p no:warnings

      - name: Check the package installs and runs from a built wheel
        # Everything above runs from a source checkout with dev extras. What a
        # user actually gets is the wheel, and only this step tests that.
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist_check

          # (a) A bare install: SQLite only, no optional drivers. Proves the
          #     base package stands on its own.
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet dist_check/*.whl
          /tmp/bare/bin/ctrlz --version
          /tmp/bare/bin/ctrlz --dsn sqlite:///$RUNNER_TEMP/w.db init
          /tmp/bare/bin/ctrlz --dsn sqlite:///$RUNNER_TEMP/w.db doctor
          # Both entry points, from a directory containing no ctrlz/ -- run
          # from the repo root the source tree shadows the install and this
          # would prove nothing.
          cd "$RUNNER_TEMP" && /tmp/bare/bin/python -m ctrlz --version
          cd "$GITHUB_WORKSPACE"

          # (b) With the optional drivers, so every module can be imported.
          #     A module dropped from packaging passes the entire suite above,
          #     because the suite imports from the source checkout where it
          #     obviously exists. A reviewer's first guess at a broken install
          #     was exactly that, and nothing could answer them quickly.
          python -m venv /tmp/full
          /tmp/full/bin/pip install --quiet "$(ls dist_check/*.whl)[postgres,mysql]"
          cd "$RUNNER_TEMP"
          /tmp/full/bin/python - <<'CHECK'
          import importlib, pathlib
          import ctrlz

          root = pathlib.Path(ctrlz.__file__).parent
          names = []
          for path in sorted(root.rglob("*.py")):
              if "__pycache__" in path.parts or path.stem == "__main__":
                  continue
              parts = [p for p in path.relative_to(root).with_suffix("").parts
                       if p != "__init__"]
              names.append(".".join(["ctrlz", *parts]))

          assert len(names) >= 15, f"only found {names}"
          for name in names:
              importlib.import_module(name)
          assert (root / "policy" / "defaults.yaml").is_file(), "rulebook not packaged"
          assert (root / "py.typed").is_file(), "typing marker not packaged"
          print(f"{len(names)} modules imported from the installed wheel")
          CHECK

      - name: Publish the benchmark numbers
        # Spec §10.6: benchmarks must run in CI *and publish numbers*. Asserting
        # a budget only says nothing collapsed; the numbers say what it costs
        # and which way that is moving. They land in the job summary.
        if: matrix.python == '3.12'
        run: pytest tests/test_benchmark.py -q -p no:warnings

      - name: Check the package installs and runs from a built wheel
        # Everything above runs from a source checkout with dev extras. What a
        # user actually gets is the wheel, and only this step tests that -- the
        # policy file being packaged, the console script existing, the import
        # graph working without the dev dependencies present.
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist_check
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist_check/*.whl
          /tmp/wheelcheck/bin/ctrlz --version
          /tmp/wheelcheck/bin/ctrlz --dsn sqlite:///$RUNNER_TEMP/w.db init
          /tmp/wheelcheck/bin/ctrlz --dsn sqlite:///$RUNNER_TEMP/w.db doctor
          # Both entry points, from a directory with no ctrlz/ in it -- run
          # from the repo root, the source tree shadows the install and this
          # proves nothing.
          cd "$RUNNER_TEMP"
          /tmp/wheelcheck/bin/python -m ctrlz --version
          # Every module, from the wheel. A module dropped from packaging
          # passes the whole suite above, because the suite imports from the
          # source checkout where it obviously exists. A reviewer's first
          # guess at a broken install was exactly this, and nothing could
          # have answered them quickly.
          /tmp/wheelcheck/bin/python - <<'CHECK'
          import importlib, pathlib, sys
          import ctrlz
          root = pathlib.Path(ctrlz.__file__).parent
          names = []
          for path in sorted(root.rglob("*.py")):
              if "__pycache__" in path.parts or path.stem == "__main__":
                  continue
              parts = [p for p in path.relative_to(root).with_suffix("").parts
                       if p != "__init__"]
              names.append(".".join(["ctrlz", *parts]))
          assert len(names) >= 15, f"only found {names}"
          for name in names:
              importlib.import_module(name)
          assert (root / "policy" / "defaults.yaml").is_file(), "rulebook not packaged"
          assert (root / "py.typed").is_file(), "typing marker not packaged"
          print(f"{len(names)} modules imported from the installed wheel")
          CHECK
